services:
    db:
        image: postgres:16-alpine
        container_name: sheeptrade_db
        environment:
            POSTGRES_USER: sheep
            POSTGRES_PASSWORD: sheep_pass
            POSTGRES_DB: sheeptrade_db
        ports:
          - "5432:5432"
        volumes:
          - postgres_data:/var/lib/postgresql/data
        restart: unless-stopped
    
    redis:
        image: redis:7-alpine
        container_name: sheeptrade_redis
        ports:
          - "6379:6379"
        volumes:
          - redis_data:/data
        restart: unless-stopped

    api:
      build: .
      container_name: sheeptrade_api
      ports:
        - "8000:8000"
      environment:
        - POSTGRES_HOST=db
        - REDIS_HOST=redis
      depends_on:
        - db
        - redis
      restart: unless-stopped

volumes:
    postgres_data:
    redis_data: